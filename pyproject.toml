[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudora"
version = "0.3.0"
description = "See and control your computer from any browser, with one secret key"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "cryptography>=42",
    "mss>=9",
    "Pillow>=10",
    "av>=12",
    "aioquic>=1.2",
    "jeepney>=0.8; sys_platform == 'linux'",
    "soundcard>=0.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pip-audit", "bandit"]

[project.scripts]
cloudora = "cloudora.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cloudora.portal" = ["viewer.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live_desktop: uses this computer's real screen (opt in with CLOUDORA_LIVE_DESKTOP=1)"]
